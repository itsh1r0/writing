<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">
<style>
  body { 
    margin: 0; 
    display: flex; 
    height: 100vh; 
    overflow: hidden; 
    font-family: 'Noto Sans', sans-serif;
  }
  #sidebar { 
    width: 250px; 
    border-right: 2px solid var(--border); 
    position: relative; 
    overflow-y: auto; 
    padding-top: 20px; 
  }
  #sidebar::before { 
    content: ''; 
    position: fixed; 
    left: 28px; 
    top: 0; 
    bottom: 0; 
    width: 4px; 
    background: var(--border); 
    z-index: 1; 
  }
  .nav-item { 
    position: relative; 
    padding: 25px 20px 25px 60px; 
    cursor: pointer; 
    z-index: 2; 
    font-size: 1.2em; 
    word-wrap: break-word;
  }
  .nav-item::before { 
    content: ''; 
    position: absolute; 
    left: 17px; 
    top: 25px; 
    width: 26px; 
    height: 26px; 
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 50%; 
  }
  .nav-item:hover { color: var(--accent); }
  #main { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
  }
  #header { 
    padding: 40px 50px 10px; 
    text-align: center; 
    font-size: 4em; 
    font-weight: bold; 
    text-transform: uppercase;
  }
  #date {
    text-align: center;
    color: var(--text-light);
    padding-bottom: 30px;
    border-bottom: 2px solid var(--border);
    font-size: 1.2em;
  }
  #content { 
    padding: 50px 80px; 
    overflow-y: auto; 
    font-size: 1.3em; 
    line-height: 1.6; 
  }
  @media (max-width: 768px) {
    body { flex-direction: column; }
    #sidebar { flex-shrink: 0; width: auto; border-right: none; border-bottom: 2px solid var(--border); display: flex; overflow-x: auto; padding: 10px; }
    #sidebar::before { display: none; }
    .nav-item { padding: 10px 20px; font-size: 1em; white-space: nowrap; }
    .nav-item::before { display: none; }
    #main { min-height: 0; }
    #header { font-size: 2em; padding: 20px 10px 10px; }
    #date { font-size: 0.9em; padding-bottom: 15px; }
    #content { padding: 20px 20px 80px 20px; font-size: 1em; }
  }
</style>
</head>
<body>
  <div id="sidebar"></div>
  <div id="main">
    <div id="header">NAME FILE</div>
    <div id="date"></div>
    <div id="content"></div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const sidebar = document.getElementById('sidebar');
    const header = document.getElementById('header');
    const dateEl = document.getElementById('date');
    const content = document.getElementById('content');

    async function loadFile(name, isRoot = false) {
      header.textContent = name.replace(/\.md$/i, '');
      dateEl.textContent = '';
      try {
        const path = isRoot ? name : 'files/' + name;
        const res = await fetch(encodeURI(path) + '?t=' + Date.now());
        if (!res.ok) throw new Error('File not found');
        const lastMod = res.headers.get('Last-Modified');
        if (lastMod) {
          dateEl.textContent = 'Last Modified: ' + new Date(lastMod).toLocaleString();
        }
        const text = await res.text();
        content.innerHTML = marked.parse(text);
      } catch (e) {
        content.innerHTML = '<p>Missing file. Make .md file in repo.</p>';
      }
    }

    async function init() {
      loadFile('home.md', true);
      try {
        const res = await fetch('files.json?t=' + Date.now());
        const files = await res.json();
        files.forEach((f) => {
          let div = document.createElement('div');
          div.className = 'nav-item';
          div.textContent = f;
          div.onclick = () => loadFile(f);
          sidebar.appendChild(div);
        });
      } catch (e) {
        console.error('No files.json found');
      }
    }

    init();
  </script>
</body>
</html>
